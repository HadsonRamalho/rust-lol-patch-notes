[package]
name = "rust-lol-patch-notes"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.9.2"
tokio = { version = "1.47.1", features = ["rt-multi-thread"] }
thirtyfour = "0.31"
reqwest = "0.12.23"
scraper = "*"
chrono = "0.4.42"
serde = "1.0.225"
serde_json = "1.0.145"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
axum = { version = "0.8.6", features = ["macros"] }
hyper = "1.7.0"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors"] }
